function gradeEssay(t){
 const x=t.trim();if(!x)return[0,0,0,0,0];

 const has=a=>a.filter(w=>low.includes(w)).length;
 let c1=Math.round(Math.min(1,commas/(S*1.2))*80)+(/[.!?]\s*$/.test(x)?40:0)+Math.round(sents.filter(s=>/^[A-ZÀ-Ú]/.test(s.trim())).length/S*50)+(/\s{2,}|\s,|,\S/.test(x.replace(/\n/g,' '))?0:30);

 let c3=Math.min(100,has(th)*20)+Math.min(100,has(rep)*34);
 let c4=(has(['atualmente','na sociedade','nos dias de hoje','é fato','com o advento','contemporane','no brasil'])?50:0)+(has(['primeiramente','em primeiro lugar','além disso','ademais','outrossim','por outro lado','segundo','pois','porque'])?50:0)+(has(['portanto','em suma','diante do exposto','dessa forma','assim','logo','por fim','conclui'])?50:0)+Math.min(50,Math.round(W/80*50));

 if(wait){tick();tm=setInterval(tick,1000)}
 if(u&&!u.sub&&ui.sec==='r'){last=u.essay;cnt()}}
const hdr=u=>`<header class="flex items-center justify-between gap-2 p-4 max-w-4xl mx-auto noprint"><b class="gold text-lg">🎓 Simulado ENEM</b><span class="flex items-center gap-2"><span class="mut text-sm hidden sm:inline">${esc(u.name)}</span><button class="btn2" onclick="logout()">Sair</button></span></header>`;

function authV(){const r=ui.mode==='up';
 return `<main class="max-w-md mx-auto p-5 pt-10"><div class="text-center mb-6"><div class="text-5xl">🎓</div><h1 class="text-3xl font-extrabold gold">Simulado ENEM</h1><p class="mut">3 áreas objetivas + Redação · nota liberada em 24h</p></div>
<form class="glass p-6 space-y-3" onsubmit="return auth(event)"><div class="flex gap-2"><button type="button" class="tab flex-1 ${r?'':'on'}" onclick="ui.mode='in';render(true)">Entrar</button><button type="button" class="tab flex-1 ${r?'on':''}" onclick="ui.mode='up';render(true)">Criar conta</button></div>
${r?'<input id="nm" class="inp" placeholder="Nome do aluno" required>':''}<input id="em" type="email" class="inp" placeholder="E-mail" required><input id="pw" type="password" class="inp" placeholder="Senha (mín. 4 caracteres)" minlength="4" required>
<p id="msg" class="text-sm text-red-400"></p><button class="btn w-full">${r?'Criar conta':'Entrar'}</button><p class="mut text-xs text-center">${DB?'Dados salvos no banco de dados.':'⚠️ Banco de dados indisponível: nada será salvo. Abra o link logado no Claude.'}</p></form></main>`}
function auth(e){e.preventDefault();const em=$('#em').value.trim().toLowerCase(),pw=btoa(unescape(encodeURIComponent($('#pw').value))),msg=$('#msg');
 if(ui.mode==='up'){if(users[em]){msg.textContent='E-mail já cadastrado.';return false}
  users[em]={name:$('#nm').value.trim(),pw,insc:'26'+String(Math.random()).slice(2,12),cpf:cpf(),ans:blank(),essay:'',sub:null};save()}
 else if(!users[em]||users[em].pw!==pw){msg.textContent='E-mail ou senha incorretos.';return false}
 ses=em;sync();ui.sec='h';ui.q=0;render(true);return false}
function logout(){ses=null;sync();ui.mode='in';render(true)}

function examV(){const u=U(),k=ui.sec,tot=SEC.reduce((a,s)=>a+u.ans[s.k].filter(v=>v!=null).length,0);
 const tabs=SEC.map(s=>`<button class="tab ${k===s.k?'on':''}" onclick="ui.sec='${s.k}';ui.q=0;render(true)">${s.s} <span class="mut">${u.ans[s.k].filter(v=>v!=null).length}/20</span></button>`).join('')+`<button class="tab ${k==='r'?'on':''}" onclick="ui.sec='r';render(true)">Redação ${u.essay.trim()?'✓':''}</button>`;
 let body;
 if(k==='r')body=`<div class="glass p-5 space-y-3"><h2 class="text-xl font-bold gold">Redação</h2><p class="font-semibold">Tema: ${THEME}</p><p class="mut text-sm">${SUP}</p>
<textarea id="es" rows="15" class="inp" style="line-height:1.6" placeholder="Escreva seu texto dissertativo-argumentativo (máx. 15 linhas)..." oninput="ess(this)">${esc(u.essay)}</textarea>
<div class="flex justify-between text-sm"><span id="lc"></span><span id="wc" class="mut"></span></div><p class="mut text-xs">Considera-se cerca de 88 caracteres por linha. O texto é bloqueado ao atingir 15 linhas.</p></div>`;
 else{const s=SEC.find(x=>x.k===k),i=ui.q,x=s.q[i],sel=u.ans[k][i];
  body=`<div class="glass p-5"><div class="flex justify-between mb-3"><b class="gold">${s.n}</b><span class="mut text-sm">Questão ${i+1}/20 · 50 pts</span></div>
<div class="flex flex-wrap gap-2 mb-5">${s.q.map((_,j)=>`<button class="nb ${u.ans[k][j]!=null?'done':''} ${j===i?'cur':''}" onclick="ui.q=${j};render(false)">${j+1}</button>`).join('')}</div>
<p class="text-lg font-semibold mb-4">${i+1}. ${x.t}</p><div class="space-y-2">${x.o.map((o,j)=>`<button class="opt ${sel===j?'sel':''}" onclick="ans(${j})"><b>${L[j]})</b><span>${o}</span></button>`).join('')}</div>
<div class="flex justify-between mt-5"><button class="btn2" ${i?'':'disabled style="opacity:.4"'} onclick="ui.q--;render(false)">← Anterior</button><button class="btn2" ${i<19?'':'disabled style="opacity:.4"'} onclick="ui.q++;render(false)">Próxima →</button></div></div>`}
 const miss=SEC.map(s=>20-u.ans[s.k].filter(v=>v!=null).length),conf=ui.conf?`<div class="glass p-5 mt-4"><p class="font-semibold">Enviar o simulado?</p><p class="mut text-sm my-2">Sem resposta: Humanas ${miss[0]}, Natureza ${miss[1]}, Matemática ${miss[2]}. Redação: ${u.essay.trim()?'preenchida':'em branco'}. Após o envio não será possível alterar.</p><button class="btn" onclick="send()">Confirmar envio</button> <button class="btn2" onclick="ui.conf=false;render(false)">Voltar</button></div>`:'';
 return hdr(u)+`<main class="max-w-4xl mx-auto p-4 pb-10"><div class="glass p-3 mb-4"><div class="flex flex-wrap gap-2">${tabs}</div><div class="h-2 rounded bg-white/10 mt-3 overflow-hidden"><div class="h-2" style="width:${tot/60*100}%;background:linear-gradient(90deg,#3b82f6,#fbbf24);transition:.4s"></div></div><p class="mut text-xs mt-1">${tot}/60 questões respondidas</p></div>${body}<div class="text-center mt-5"><button class="btn" onclick="ui.conf=true;render(false)">Finalizar e enviar simulado</button></div>${conf}</main>`}
function ans(j){const u=U();u.ans[ui.sec][ui.q]=j;save();render(false)}
function ess(el){let v=el.value;if(lc(v)>15){v=last;el.value=v}last=v;U().essay=v;save();cnt()}
function cnt(){const e=$('#es');if(!e)return;const l=lc(e.value);$('#lc').innerHTML=`Linhas: <b class="${l>=15?'text-red-400':'gold'}">${l}/15</b>`;$('#wc').textContent=wc(e.value)+' palavras'}
function send(){U().sub=Date.now();save();render(true)}

function waitV(){const u=U();return hdr(u)+`<main class="max-w-xl mx-auto p-5 text-center"><div class="glass p-8"><div class="text-5xl mb-2">📨</div><h2 class="text-2xl font-bold gold">Simulado enviado!</h2><p class="mut my-2">Enviado em ${new Date(u.sub).toLocaleString('pt-BR')}. Seu boletim será liberado em:</p><div id="cd" class="text-5xl font-extrabold my-5" style="text-shadow:0 0 22px rgba(251,191,36,.6)">24:00:00</div><p class="mut text-sm mb-5">Volte quando o cronômetro zerar para ver suas notas.</p><button class="btn2" onclick="dev()">[DEV] Acelerar Tempo / Liberar Nota Agora</button></div></main>`}
function tick(){const u=U(),left=864e5-(Date.now()-u.sub);if(left<=0){render(true);return}const s=Math.floor(left/1e3),p=n=>String(n).padStart(2,'0'),e=$('#cd');if(e)e.textContent=`${p(s/3600|0)}:${p(s%3600/60|0)}:${p(s%60)}`}
function dev(){U().sub=Date.now()-864e5;save();render(true)}
function again(){const u=U();u.ans=blank();u.essay='';u.sub=null;save();ui.sec='h';ui.q=0;render(true)}

function histV(u){const h=(u.hist||[]).slice().reverse(),b=Math.max(...h.map(x=>x.avg));return `<div class="glass p-4 mt-4"><div class="flex justify-between flex-wrap gap-1"><b class="gold">📈 Histórico de notas (salvo)</b><span class="mut text-sm">${h.length} simulado(s) · melhor média ${fmt(b)}</span></div><div style="overflow-x:auto"><table class="w-full mt-2 text-sm"><tr class="mut"><th>Data</th><th>Hum.</th><th>Nat.</th><th>Mat.</th><th>Red.</th><th>Média</th></tr>${h.map(x=>`<tr><td>${new Date(x.t).toLocaleDateString('pt-BR')}</td><td>${fmt(x.h)}</td><td>${fmt(x.n)}</td><td>${fmt(x.m)}</td><td>${fmt(x.r)}</td><td><b class="${x.avg===b?'gold':''}">${fmt(x.avg)}</b></td></tr>`).join('')}</table></div></div>`}
function repV(){const u=U(),r=calc(u);if(!(u.hist||[]).some(x=>x.t===u.sub)){(u.hist=u.hist||[]).push({t:u.sub,h:r.h,n:r.n,m:r.m,r:r.r,avg:r.avg});save()}const CN=['Pontuação','Coesão e coerência','Tema e repertório','Estrutura dissertativa','Proposta de intervenção'];
 const row=(n,v)=>`<tr><td>${n}</td><td><b>${fmt(v)}</b> / 1000</td></tr>`;
 const gab=SEC.map(s=>`<div class="glass p-4 mt-4"><div class="flex justify-between"><b class="gold">${s.n}</b><span class="mut text-sm">${r[s.k+'ok']} certas · ${20-r[s.k+'ok']} erradas/em branco</span></div><div class="grid grid-cols-5 sm:grid-cols-10 gap-2 mt-3">${s.q.map((x,i)=>{const a=u.ans[s.k][i];return`<div class="gc ${a==null?'bl':a===x.c?'ok':'no'}"><b>${i+1}</b><br>${a==null?'–':L[a]}/${L[x.c]}</div>`}).join('')}</div><p class="mut text-xs mt-2">Formato: sua resposta / gabarito</p></div>`).join('');
 return hdr(u)+`<main class="max-w-4xl mx-auto p-4 pb-10"><div class="glass p-6"><div class="text-center"><h2 class="text-2xl font-extrabold gold">BOLETIM DE DESEMPENHO — ENEM SIMULADO</h2></div>
<div class="grid sm:grid-cols-3 gap-2 my-4 text-sm"><div><span class="mut">Candidato</span><br><b>${esc(u.name)}</b></div><div><span class="mut">CPF (fictício)</span><br><b>${u.cpf}</b></div><div><span class="mut">Inscrição</span><br><b>${u.insc}</b></div></div>
<table class="w-full">${row('Ciências Humanas',r.h)}${row('Ciências da Natureza',r.n)}${row('Matemática',r.m)}${row('Redação',r.r)}<tr><td><b class="gold">Média Geral do ENEM</b></td><td><b class="gold text-xl">${fmt(r.avg)}</b></td></tr></table></div>
<div class="glass p-4 mt-4"><b class="gold">Redação — competências</b><table class="w-full mt-2">${CN.map((n,i)=>`<tr><td>C${i+1}. ${n}</td><td>${fmt(r.e[i])} / 200,0</td><td class="mut">${r.e[i]>=160?'Excelente':r.e[i]>=100?'Bom':'Precisa melhorar'}</td></tr>`).join('')}</table><p class="mut text-xs mt-2">Correção automática por análise de pontuação, conectivos, tema/repertório, estrutura e proposta de intervenção.</p></div>${gab}${histV(u)}
<div class="flex gap-2 justify-center mt-6 noprint"><button class="btn" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button><button class="btn2" onclick="again()">Novo simulado</button></div></main>`}
render(true);initDb();
</script>
</body>
</html>
